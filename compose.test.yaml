services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: usage_metering_test
      POSTGRES_USER: metering_test
      POSTGRES_PASSWORD: local_test_password
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U metering_test -d usage_metering_test
      interval: 2s
      timeout: 3s
      retries: 30