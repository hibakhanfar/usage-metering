services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - metering_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      PORT: "3000"
      DB_POOL_SIZE: "20"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    init: true
  demo:
    build:
      context: ./example
    environment:
      API_BASE_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
    depends_on:
      api:
        condition: service_healthy
    init: true
  k6:
    image: grafana/k6:1.0.0
    profiles:
      - performance
    environment:
      API_BASE_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
    volumes:
      - ./performance:/scripts:ro
      - ./performance/results:/results
    depends_on:
      api:
        condition: service_healthy
    command:
      - run
      - /scripts/load.ts
volumes:
  metering_data: