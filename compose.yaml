services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "synchronous_commit=${PG_SYNC_COMMIT:-on}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage_metering}
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering_dev_password}
    volumes:
      - metering_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering_dev_password}@postgres:5432/${POSTGRES_DB:-usage_metering}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
      PORT: "3000"
      DB_POOL_SIZE: "20"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    init: true

  demo:
    build:
      context: ./example
    environment:
      API_BASE_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
    depends_on:
      api:
        condition: service_healthy
    init: true

  k6:
    image: grafana/k6:1.0.0
    profiles:
      - performance
    environment:
      API_BASE_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
      CONSUME_BATCH_MAX: ${CONSUME_BATCH_MAX:-50}
    volumes:
      - ./performance:/scripts:ro
      - ./performance/results:/results
    depends_on:
      api:
        condition: service_healthy
    command:
      - run
      - /scripts/load.ts

volumes:
  metering_data: